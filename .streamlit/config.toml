[theme]
base = "dark"
primaryColor = "#7C5CFC"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#151C2E"
textColor = "#F8FAFC"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
folderWatchBlacklist = ["models", "data", ".venv", "venv"]
